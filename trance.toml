# trance configuration.
#
# Providers are named model endpoints. `kind` selects the client: `anthropic`
# speaks the Messages API via the official SDK; `openai`, `ollama` and
# `llamacpp` share the OpenAI-compatible /chat/completions shape.
#
# The provider `name` is the shortname you attach to an agent, so a single run
# can mix backends — a big local model for the coder, a hosted one for review.
#
# This file SEEDS the registry on first run; after that runs/providers.json is
# the source of truth so edits made in the settings UI persist.
#
# context_window matters: it is the budget the agent runner trims tool results
# against. Set it too high and the endpoint 500s mid-run; too low and you waste
# capacity. For llama-server it is the per-slot n_ctx (check /props).

[providers.llama]
kind = "llamacpp"
label = "llama-server (local)"
base_url = "http://localhost:12345/v1"
model = "unsloth/Qwen3.6-27B-GGUF:IQ4_XS"
context_window = 64000

[providers.ollama]
kind = "ollama"
label = "Ollama (local)"
base_url = "http://localhost:11434/v1"
model = "qwen2.5-coder:32b"
context_window = 32768

# [providers.anthropic]
# kind = "anthropic"          # uses the Anthropic SDK, not the OpenAI shape
# model = "claude-opus-5"
# api_key = "sk-ant-..."      # or set ANTHROPIC_API_KEY / run `ant auth login`
# context_window = 1000000

# [providers.openai]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_key = "sk-..."
# context_window = 128000

# The orchestrator — the agent you chat with — is configured here, not per-role.
[orchestrator]
provider = "llama"
# A reasoning model spends most of its output thinking before it answers, and
# the plan arrives as a tool call after that. 2048 truncates mid-thought.
max_tokens = 8192

# Defaults for working agents. Any role may override provider/model in the UI.
[worker]
provider = "llama"
temperature = 0.0
max_tokens = 4096
timeout_s = 600.0
max_tool_rounds = 8

[curator]
max_hops = 2
body_hops = 1
token_budget = 8000
include_callers = false
skip_ambiguous = false

max_recurate_rounds = 2
runs_dir = "runs"
# Machine-wide state: models, settings, the Default scope new projects are
# provisioned from, the usage ledger. One set per machine, whatever the
# workspace.
system_dir = "~/.trance"
